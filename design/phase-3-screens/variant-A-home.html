<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1000px; overflow: hidden;
         font-family: "Segoe UI", system-ui, sans-serif;
         background: radial-gradient(1200px 800px at 70% -10%, #1e2a4a 0%, #0b0e1a 55%, #070812 100%);
         color: #e8eaf2; display: flex; align-items: center; justify-content: center; }
  .wrap { width: 1280px; text-align: center; }
  .kicker { letter-spacing: .35em; font-size: 13px; color: #6ea8ff; text-transform: uppercase; }
  h1 { font-size: 84px; font-weight: 800; margin: 18px 0 10px;
       background: linear-gradient(90deg,#7cc0ff,#b57bff 60%,#ff6ec7);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #9aa3bf; font-size: 20px; margin-bottom: 56px; }
  .cards { display: flex; gap: 28px; justify-content: center; }
  .card { width: 400px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12);
          border-radius: 20px; padding: 32px; backdrop-filter: blur(6px); text-align: left; }
  .card h2 { font-size: 24px; margin-bottom: 8px; }
  .card p { color: #9aa3bf; font-size: 15px; margin-bottom: 22px; }
  input { width: 100%; background: #0e1220; border: 1px solid #2a3350; color: #e8eaf2;
          border-radius: 12px; padding: 14px 16px; font-size: 17px; outline: none; }
  input.code { letter-spacing: .4em; text-transform: uppercase; text-align: center; font-weight: 700; }
  button { width: 100%; margin-top: 14px; border: none; border-radius: 12px; padding: 15px;
           font-size: 17px; font-weight: 700; cursor: pointer; color: #04102a;
           background: linear-gradient(90deg,#4f8cff,#38e1ff); }
  .ghost { background: transparent; color: #bcd3ff; border: 1px solid #2a3350; }
  .or { color: #6b7392; font-size: 13px; margin: 14px 0 2px; }
</style>
</head>
<body><div class="wrap">
  <div class="kicker">Roll · Buy · Build · Bankrupt your friends</div>
  <h1>Neon Monopoly 3D</h1>
  <div class="sub">Free online multiplayer board game in your browser — no account needed.</div>
  <div class="cards">
    <div class="card">
      <h2>Create a private game</h2>
      <p>You'll get a 6-character code to share with friends.</p>
      <input placeholder="Your nickname">
      <button>Create room</button>
    </div>
    <div class="card">
      <h2>Join with a code</h2>
      <p>Got an invite code? Drop it here.</p>
      <input class="code" placeholder="X4K9RD" maxlength="6">
      <button>Join room</button>
      <div class="or">— or —</div>
      <button class="ghost">Browse public rooms</button>
    </div>
  </div>
</div></body>
</html>
