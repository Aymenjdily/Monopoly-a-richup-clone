<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1000px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif;
         background: #fff4e0; color: #2b2038; display: flex; align-items: center; justify-content: center;
         background-image: radial-gradient(circle at 10% 14%, #c8f0ff 0 40px, transparent 41px),
           radial-gradient(circle at 92% 20%, #ffd8a8 0 44px, transparent 45px),
           radial-gradient(circle at 16% 86%, #ffc2d1 0 52px, transparent 53px),
           radial-gradient(circle at 88% 84%, #b8f2c9 0 46px, transparent 47px), #fff4e0; }
  .wrap { width: 1030px; }
  .card { background: #fff; border: 4px solid #2b2038; border-radius: 24px; padding: 40px 46px;
          box-shadow: 10px 10px 0 #2b2038; }
  .head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .chip { background: #ffd23e; border: 3px solid #2b2038; border-radius: 999px; padding: 8px 18px;
          font-weight: 800; font-size: 14px; }
  h1 { font-size: 36px; font-weight: 900; }
  .codebox { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .code { font-family: Consolas, monospace; font-size: 42px; font-weight: 900; letter-spacing: .3em;
          background: #fff8ef; border: 3px solid #2b2038; border-radius: 14px; padding: 12px 22px 12px 32px;
          color: #ff5c8a; }
  .copy { border: 3px solid #2b2038; background: #fff; border-radius: 10px; padding: 11px 18px;
          font-weight: 800; font-size: 14px; box-shadow: 3px 3px 0 #2b2038; }
  .players { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 26px; }
  .p { display: flex; align-items: center; gap: 12px; background: #fff8ef; border: 3px solid #2b2038;
       border-radius: 14px; padding: 13px 16px; font-weight: 700; font-size: 18px; }
  .pawn { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2b2038; }
  .tag { margin-left: auto; background: #ff5c8a; color: #fff; border: 2px solid #2b2038;
         border-radius: 999px; padding: 2px 10px; font-size: 11px; }
  .empty { color: #b3a6be; }
  button.big { width: 100%; background: #ff5c8a; color: #fff; border: 4px solid #2b2038;
               border-radius: 14px; padding: 17px; font-size: 20px; font-weight: 900;
               box-shadow: 5px 5px 0 #2b2038; cursor: pointer; }
  .hint { text-align: center; color: #8a7d96; font-weight: 600; font-size: 14px; margin-top: 14px; }
</style></head>
<body><div class="wrap"><div class="card">
  <div class="head"><h1>Room lobby</h1><div class="chip">3 / 6 PLAYERS</div></div>
  <div class="codebox">
    <div class="code">X4K9RD</div>
    <div class="copy">COPY</div>
  </div>
  <div class="players">
    <div class="p"><div class="pawn" style="background:#ff5c8a"></div>Sasha<span class="tag">HOST ★</span></div>
    <div class="p"><div class="pawn" style="background:#ffd23e"></div>Juno</div>
    <div class="p"><div class="pawn" style="background:#e8e8e8"></div><span class="empty">waiting…</span></div>
    <div class="p"><div class="pawn" style="background:#e8e8e8"></div><span class="empty">waiting…</span></div>
  </div>
  <button class="big">START THE GAME — ROLL! 🎲</button>
  <div class="hint">Everyone joins with this code. The host can start once we're 2+.</div>
</div></div></body>
</html>
