<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1000px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif;
         color: #241a33; position: relative;
         background-image:
           radial-gradient(circle at 8% 12%, #ffd8a8 0 110px, transparent 111px),
           radial-gradient(circle at 94% 16%, #c8f0ff 0 130px, transparent 131px),
           radial-gradient(circle at 10% 88%, #ffc2d1 0 140px, transparent 141px),
           radial-gradient(circle at 92% 86%, #b8f2c9 0 120px, transparent 121px),
           radial-gradient(rgba(36,26,51,.06) 2.4px, transparent 2.4px);
         background-size: auto, auto, auto, auto, 34px 34px;
         background-color: #fff4e0;
         display: flex; align-items: center; justify-content: center; }
  .wrap { width: 1120px; position: relative; z-index: 2; }
  .card { background: #fff; border: 4px solid #241a33; border-radius: 26px;
          padding: 40px 44px 0; box-shadow: 0 8px 0 #241a33, 20px 22px 0 rgba(36,26,51,.14); }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .back { width: 44px; height: 44px; border: 3px solid #241a33; border-radius: 12px; background: #fff8ef;
          font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center;
          box-shadow: 0 4px 0 #241a33; }
  h1 { font-size: 40px; font-weight: 900; letter-spacing: -.03em; }
  .count { margin-left: auto; background: #ffd23e; border: 3px solid #241a33; border-radius: 999px;
           padding: 9px 18px; font-weight: 900; font-size: 15px; box-shadow: 3px 3px 0 #241a33; }
  .label { font-size: 12px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color:#8a7d96; margin-bottom: 10px; }
  .tiles { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .tile { width: 62px; height: 66px; background: #ff5c8a; color: #fff; border: 3px solid #241a33;
          border-radius: 12px; font-family: Consolas, monospace; font-size: 34px; font-weight: 900;
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 5px 0 #241a33; transform: rotate(-2deg); }
  .tile:nth-child(2n) { background: #7c4dff; transform: rotate(2deg); }
  .tile:nth-child(5) { background: #24a37a; }
  .copy { width: 56px; height: 56px; border: 3px solid #241a33; border-radius: 12px; background: #fff8ef;
          font-size: 22px; display: flex; align-items: center; justify-content: center;
          box-shadow: 0 4px 0 #241a33; margin-left: 8px; }
  .note { color: #8a7d96; font-weight: 700; font-size: 13px; margin-bottom: 26px; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .p { display: flex; align-items: center; gap: 14px; background: #fff8ef; border: 3px solid #241a33;
       border-radius: 16px; padding: 14px 18px; font-weight: 800; font-size: 20px; position: relative; }
  .p.you { background: #eef7ff; box-shadow: 0 4px 0 #241a33; }
  .pawn { width: 30px; height: 30px; flex: none; position: relative; }
  .pawn .head { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: inherit; top: 0; left: 50%; transform: translateX(-50%); border: 3px solid #241a33; }
  .pawn .body { position: absolute; width: 22px; height: 12px; border-radius: 10px 10px 4px 4px; background: inherit; bottom: 0; left: 50%; transform: translateX(-50%); border: 3px solid #241a33; }
  .tag { margin-left: auto; font-size: 11px; font-weight: 900; letter-spacing: .06em; border: 2px solid #241a33;
         border-radius: 999px; padding: 3px 10px; background: #ffd23e; }
  .empty { color: #b3a6be; font-weight: 700; }
  .empty .dots { letter-spacing: 3px; margin-left: auto; color: #d5cbe0; font-weight: 900; font-size: 22px; }
  .steps { display: flex; gap: 10px; margin: 12px 0 4px; }
  .step { flex: 1; background: #fff8ef; border: 3px dashed #241a33; border-radius: 12px;
          padding: 9px 12px; font-size: 12.5px; font-weight: 800; color: #6b5f7c; text-align: center; }
  button.big { width: 100%; margin: 18px 0 28px; background: #24a37a; color: #fff; border: 4px solid #241a33;
               border-radius: 16px; padding: 18px; font-size: 24px; font-weight: 900; letter-spacing: .02em;
               box-shadow: 0 6px 0 #241a33, 12px 12px 0 rgba(36,26,51,.14); }
  .strip { margin: 0 -44px; border-top: 4px solid #241a33; border-radius: 0 0 22px 22px; display: flex; height: 46px; overflow: hidden; }
  .strip i { flex: 1; border-right: 4px solid #241a33; }
  .strip i:last-child { border-right: none; }
  .s i:nth-child(1){background:#955436} .s i:nth-child(2){background:#aae0fa} .s i:nth-child(3){background:#d93a96}
  .s i:nth-child(4){background:#f7941d} .s i:nth-child(5){background:#ed1b24} .s i:nth-child(6){background:#fef200}
  .s i:nth-child(7){background:#1fb25a} .s i:nth-child(8){background:#0072bb}
</style></head>
<body><div class="wrap"><div class="card">
  <div class="head">
    <div class="back">←</div>
    <h1>Waiting room</h1>
    <div class="count">3 / 6 PLAYERS</div>
  </div>
  <div class="label">Share this code</div>
  <div class="tiles">
    <div class="tile">X</div><div class="tile">4</div><div class="tile">K</div><div class="tile">9</div><div class="tile">R</div><div class="tile">D</div>
    <div class="copy">⧉</div>
  </div>
  <div class="note">Friends visit this site and enter the code — no account needed.</div>
  <div class="players">
    <div class="p you"><div class="pawn" style="background:#ff5c8a"><i class="head"></i><i class="body"></i></div>Sasha <span style="color:#8a7d96">(you)</span><span class="tag">HOST ★</span></div>
    <div class="p"><div class="pawn" style="background:#ffd23e"><i class="head"></i><i class="body"></i></div>Juno<span class="dots"></span></div>
    <div class="p empty"><div class="pawn" style="background:#e6ddf0"><i class="head"></i><i class="body"></i></div>Empty seat<span class="dots">···</span></div>
    <div class="p empty"><div class="pawn" style="background:#e6ddf0"><i class="head"></i><i class="body"></i></div>Empty seat<span class="dots">···</span></div>
    <div class="p empty"><div class="pawn" style="background:#e6ddf0"><i class="head"></i><i class="body"></i></div>Empty seat<span class="dots">···</span></div>
    <div class="p empty"><div class="pawn" style="background:#e6ddf0"><i class="head"></i><i class="body"></i></div>Empty seat<span class="dots">···</span></div>
  </div>
  <div class="steps">
    <div class="step">1 · Share the code</div>
    <div class="step">2 · Everyone takes a seat</div>
    <div class="step">3 · Host starts — roll!</div>
  </div>
  <button class="big">START THE GAME — ROLL! 🎲</button>
  <div class="strip s"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div></div></body>
</html>
