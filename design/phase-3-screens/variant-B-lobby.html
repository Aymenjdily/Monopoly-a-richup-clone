<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1000px; overflow: hidden; font-family: Georgia, "Times New Roman", serif;
         background: #12241a; color: #f2e8d5; display: flex; align-items: center; justify-content: center;
         background-image:
           radial-gradient(1000px 700px at 20% 0%, #1d3d2b 0%, transparent 60%),
           radial-gradient(900px 700px at 90% 100%, #241a10 0%, transparent 55%); }
  .wrap { width: 1000px; }
  .panel { background: linear-gradient(180deg, #1a2f22, #14261b); border: 1px solid #3e5a41;
           border-radius: 6px; padding: 46px 56px; box-shadow: 0 18px 40px rgba(0,0,0,.45); position: relative; }
  .panel:before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(201,168,106,.4); pointer-events: none; }
  .kicker { letter-spacing: .4em; font-size: 12px; color: #c9a86a; text-transform: uppercase; }
  h1 { font-size: 42px; font-weight: 700; color: #f6e7c9; margin: 10px 0 24px; }
  .codebox { display: flex; gap: 14px; align-items: center; margin-bottom: 32px; }
  .code { font-family: Consolas, monospace; font-size: 40px; letter-spacing: .3em; color: #c9a86a;
          background: #0f1c14; border: 1px solid #3e5a41; padding: 12px 22px; border-radius: 3px;
          padding-left: 34px; font-weight: 700; }
  .copy { border: 1px solid #3e5a41; background: transparent; color: #c9a86a; padding: 12px 18px;
          border-radius: 3px; font-size: 14px; letter-spacing: .08em; }
  .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; }
  .seat { display: flex; align-items: center; gap: 12px; background: #0f1c14; border: 1px solid #2c4432;
          border-radius: 3px; padding: 14px 18px; }
  .pawn { width: 22px; height: 22px; border-radius: 4px 4px 10px 10px; transform: rotate(45deg); }
  .nm { font-size: 18px; }
  .hosttag { margin-left: auto; font-size: 11px; letter-spacing: .2em; color: #c9a86a; border: 1px solid #3e5a41; padding: 3px 10px; border-radius: 2px; }
  .empty { color: #6b7a63; font-size: 15px; font-style: italic; }
  button.big { width: 100%; background: #c9a86a; color: #14261b; border: none; padding: 16px;
               font-size: 17px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
               border-radius: 3px; cursor: pointer; font-family: inherit; }
  .hint { text-align: center; color: #8b9a82; font-size: 14px; font-style: italic; margin-top: 14px; }
</style></head>
<body><div class="wrap"><div class="panel">
  <div class="kicker">The table</div>
  <h1>Room X4K9RD</h1>
  <div class="codebox">
    <div class="code">X4K9RD</div>
    <div class="copy">COPY</div>
  </div>
  <div class="seats">
    <div class="seat"><div class="pawn" style="background:#e5484d"></div><span class="nm">Sasha</span><span class="host">HOST</span></div>
    <div class="seat"><div class="pawn" style="background:#f5a623"></div><span class="nm">Juno</span></div>
    <div class="seat"><div class="pawn" style="background:#f7cf3c"></div><span class="nm" style="color:#6b7a63">empty seat</span></div>
    <div class="seat"><div class="pawn" style="background:#46a758"></div><span class="nm" style="color:#6b7a63">empty seat</span></div>
  </div>
  <button class="big">Deal the deeds — start</button>
  <div class="hint">Players may join until the game begins. Two seats minimum.</div>
</div></div></body>
</html>
