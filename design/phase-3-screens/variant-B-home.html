<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1000px; overflow: hidden; font-family: Georgia, "Times New Roman", serif;
         background: #12241a; color: #f2e8d5; display: flex; align-items: center; justify-content: center;
         background-image:
           radial-gradient(1000px 700px at 20% 0%, #1d3d2b 0%, transparent 60%),
           radial-gradient(900px 700px at 90% 100%, #241a10 0%, transparent 55%); }
  .wrap { width: 1240px; text-align: center; }
  .rule { height: 2px; background: #c9a86a; width: 180px; margin: 0 auto; }
  .kicker { letter-spacing: .4em; font-size: 13px; color: #c9a86a; text-transform: uppercase; margin: 16px 0; }
  h1 { font-size: 90px; font-weight: 700; color: #f6e7c9; letter-spacing: .06em; margin: 6px 0 8px; }
  .sub { color: #b8a888; font-size: 19px; font-style: italic; margin-bottom: 50px; }
  .cards { display: flex; gap: 30px; justify-content: center; }
  .card { width: 380px; background: linear-gradient(180deg, #1a2f22, #14261b);
          border: 1px solid #3e5a41; border-radius: 6px; padding: 34px;
          box-shadow: 0 18px 40px rgba(0,0,0,.45); text-align: left; position: relative; }
  .card:before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(201,168,106,.4);
                 border-radius: 3px; pointer-events: none; }
  .card h2 { font-size: 26px; color: #f6e7c9; margin-bottom: 6px; font-weight: 700; }
  .card p { color: #a89b7e; font-size: 15px; margin-bottom: 24px; font-style: italic; }
  input { width: 100%; background: #0f1c14; border: 1px solid #3e5a41; color: #f2e8d5;
          border-radius: 3px; padding: 13px 15px; font-size: 17px; font-family: inherit; }
  input.code { text-align: center; letter-spacing: .45em; font-weight: 700; text-transform: uppercase; }
  button { width: 100%; margin-top: 14px; background: #c9a86a; color: #14261b; border: none;
           border-radius: 3px; padding: 14px; font-size: 17px; font-weight: 700;
           letter-spacing: .18em; text-transform: uppercase; cursor: pointer; font-family: inherit; }
  .ghost { background: transparent; color: #c9a86a; border: 1px solid #3e5a41; }
</style></head>
<body><div class="wrap">
  <div class="rule"></div>
  <div class="kicker">The property trader's table</div>
  <h1>Estates</h1>
  <div class="sub">A classic board of deals, rent, and ruin — now in 3D.</div>
  <div class="cards">
    <div class="card">
      <h2>Open a new table</h2>
      <p>Deal the deeds, roll the dice, and out-last the table.</p>
      <input placeholder="Your name at the table">
      <button>Create room</button>
    </div>
    <div class="card">
      <h2>Take a seat</h2>
      <p>Enter the six-letter table code from your host.</p>
      <input class="code" placeholder="X4K9RD" maxlength="6">
      <button>Join room</button>
    </div>
  </div>
</div></body>
</html>
