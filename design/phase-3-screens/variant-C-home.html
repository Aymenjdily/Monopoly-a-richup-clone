<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1000px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif;
         background: #fff4e0; color: #2b2038; display: flex; align-items: center; justify-content: center;
         background-image: radial-gradient(circle at 12% 18%, #ffd8a8 0 26px, transparent 27px),
           radial-gradient(circle at 88% 24%, #b8f2c9 0 34px, transparent 35px),
           radial-gradient(circle at 14% 82%, #ffe08a 0 40px, transparent 41px),
           radial-gradient(circle at 90% 78%, #ffc2d1 0 46px, transparent 47px),
           radial-gradient(circle at 50% 96%, #c8f0ff 0 52px, transparent 53px) , #fff4e0; }
  .wrap { text-align: center; }
  h1 { font-size: 96px; font-weight: 900; color: #2b2038; letter-spacing: -.03em; }
  h1 span { color: #ff5c8a; }
  .sub { font-size: 21px; color: #6b5f7c; font-weight: 600; margin: 10px 0 54px; }
  .dice { font-size: 46px; margin-bottom: 24px; }
  .cards { display: flex; gap: 26px; justify-content: center; }
  .card { width: 400px; background: #fff; border: 4px solid #2b2038; border-radius: 22px;
          padding: 32px; box-shadow: 8px 8px 0 #2b2038; text-align: left; }
  .card h2 { font-size: 26px; margin-bottom: 6px; }
  .card p { color: #6b5f7c; font-size: 15px; margin-bottom: 22px; }
  input { width: 100% ; background: #fff8ef; border: 3px solid #2b2038; border-radius: 12px;
          padding: 13px 15px; font-size: 18px; font-weight: 700; }
  input.code { text-align: center; letter-spacing: .5em; text-transform: uppercase; }
  button { width: 100%; margin-top: 14px; border: 3px solid #2b2038; border-radius: 12px;
           padding: 14px; font-size: 17px; font-weight: 800; cursor: pointer;
           background: #ff5c8a; color: #fff; box-shadow: 4px 4px 0 #2b2038; }
  .alt { background: #ffd23e; color: #2b2038; }
</style></head>
<body><div class="wrap">
  <div class="dice">🎲 ⚂ 🎲</div>
  <h1>Dice <span>&amp;</span> Deeds</h1>
  <div class="sub">Buy it. Build it. Bankrupt them. Free multiplayer, 3D board, zero ads.</div>
  <div class="cards">
    <div class="card">
      <h2>Host a game</h2>
      <p>Share your room code and start rolling in 30 seconds.</p>
      <input placeholder="Nickname">
      <button>Create room</button>
    </div>
    <div class="card">
      <h2>Got a code?</h2>
      <p>Your friend already made a room? Jump in.</p>
      <input class="code" placeholder="X4K9RD" maxlength="6">
      <button class="alt">Join the fun</button>
    </div>
  </div>
</div></body>
</html>
