<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  /* Variant B — "Neon club": charcoal board, glowing bars, steep 58° camera, rim lights */
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1000px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif;
         color: #e6e9f2;
         background:
           radial-gradient(1100px 800px at 76% 10%, rgba(124,77,255,.28), transparent 60%),
           radial-gradient(1000px 800px at 12% 96%, rgba(0,229,255,.16), transparent 58%),
           #0a0b14;
         display: flex; align-items: center; justify-content: center; }
  .scene { perspective: 1500px; }
  .board { width: 1010px; height: 1010px; transform: rotateX(50deg) rotateZ(0deg); transform-style: preserve-3d;
           border-radius: 20px;
           box-shadow: 0 80px 100px rgba(0,0,0,.7), 0 0 120px rgba(124,77,255,.25), inset 0 0 0 2px rgba(255,255,255,.08);
           background: #0d0f1a;
           border: 22px solid #232638; }
  .cap { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center;
         font-size: 22px; font-weight: 800; color: #7fa8ff; letter-spacing: .2em; }
  svg text { font-family: "Segoe UI", system-ui, sans-serif; }
</style></head>
<body><div class="scene"><div id="board" class="board"></div></div>
<div class="cap">VARIANT B — NEON CLUB · 50° STEEP · GLOW EDGES</div>
<script>
window.addEventListener("error", e => { const d = document.createElement("div"); d.style.cssText="position:fixed;top:6px;left:6px;background:#300;color:#fff;padding:8px;font-size:14px;z-index:99"; d.textContent = "ERR: " + e.message; document.body.appendChild(d); });
const G = { brown:"#7c4dff", lightblue:"#38c6ff", pink:"#ff5c8a", orange:"#ffb347", red:"#ff4d5e", yellow:"#ffe066", green:"#3fe08a", darkblue:"#6ea8ff" };
const BOARD = [
  ["GO","corner"], ["Mediterranean Ave","prop","brown"], ["Community Chest","card"], ["Baltic Ave","prop","brown"],
  ["Income Tax","tax"], ["Reading RR","rr"], ["Oriental Ave","prop","lightblue"], ["Chance","card"],
  ["Vermont Ave","prop","lightblue"], ["Connecticut Ave","prop","lightblue"], ["Jail","corner"],
  ["St. Charles Pl","prop","pink"], ["Electric Co","prop","utility"], ["States Ave","prop","pink"], ["Virginia Ave","prop","pink"],
  ["Penn RR","rr"], ["St. James Pl","prop","orange"], ["Community Chest","card"], ["Tennessee Ave","prop","orange"],
  ["New York Ave","prop","orange"], ["Free Parking","corner"], ["Kentucky Ave","prop","red"], ["Chance","card"],
  ["Indiana Ave","prop","red"], ["Illinois Ave","prop","red"], ["B&O RR","rr"], ["Atlantic Ave","prop","yellow"],
  ["Ventnor Ave","prop","yellow"], ["Water Works","prop","utility"], ["Marvin Gardens","prop","yellow"],
  ["Go To Jail","corner"], ["Pacific Ave","prop","green"], ["North Carolina","prop","green"], ["Community Chest","card"],
  ["Pennsylvania Ave","prop","green"], ["Short Line","rr"], ["Chance","card"], ["Park Place","prop","darkblue"],
  ["Luxury Tax","tax"], ["Boardwalk","prop","darkblue"]
];
const cell = 92, C = cell * 11, ink = "#0d0f1a", tile = "#171a29";
const tileFill = "#12141f";
const el = document.getElementById("board");
el.innerHTML = `<svg width="966" height="966" viewBox="0 0 ${C} ${C}" style="display:block;margin:auto;border-radius:6px">
  <rect width="${C}" height="${C}" fill="#0d0f1a"/>
  <rect x="${cell}" y="${cell}" width="${C-2*cell}" height="${C-2*cell}" fill="transparent"/>
  <text x="${C/2}" y="${C/2 - 20}" text-anchor="middle" font-size="64" font-weight="900" fill="url(#neon)" style="filter: drop-shadow(0 0 12px rgba(124,77,255,.8))">
    <defs><linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38e1ff"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient></defs>
    Dice &amp; Deeds</text>
  <text x="${C/2}" y="${C/2 + 28}" text-anchor="middle" font-size="20" letter-spacing="10" fill="#6b7392">NEON CLUB</text>
  <g id="t"></g></svg>`;
const layer = el.querySelector("#t");
let svg = "";
function tileRect(idx, col, row, side) {
  const [name, type, group] = BOARD[idx];
  const x = col * cell, y = row * cell;
  const groupColors = { brown:G.brown, lightblue:G.lightblue, pink:G.pink, orange:G.orange, red:G.red, yellow:G.yellow, green:G.green, darkblue:G.darkblue };
  const barColor = { prop: groupColors[group], rr:"#5c8dff", utility:"#7fe3a8", card:"#ff5c8a", tax:"#ffb347" }[type] ?? "";
  const strip = 10;
  let bar = "";
  if (barColor) {
    if (side === "bottom") bar = `<rect x="${x+4}" y="${y+2}" width="${cell-8}" height="${strip}" fill="${barColor}" rx="3" style="filter:drop-shadow(0 0 6px ${barColor})"/>`;
    if (side === "top") bar = `<rect x="${x+4}" y="${y+cell-strip-2}" width="${cell-8}" height="${strip}" fill="${barColor}" rx="3" style="filter:drop-shadow(0 0 6px ${barColor})"/>`;
    if (side === "left") bar = `<rect x="${x+2}" y="${y+4}" width="${strip}" height="${cell-8}" fill="${barColor}" rx="3" style="filter:drop-shadow(0 0 6px ${barColor})"/>`;
    if (side === "right") bar = `<rect x="${x+cell-strip-2}" y="${y+4}" width="${strip}" height="${cell-8}" fill="${barColor}" rx="3" style="filter:drop-shadow(0 0 6px ${barColor})"/>`;
  }
  svg += `<rect x="${x+2}" y="${y+2}" width="${cell-4}" height="${cell-4}" fill="${tileFill}" rx="8" stroke="${barColor || "#3a3f52"}" stroke-width="2"/>${bar}`;
  if (type === "corner") {
    svg += `<text x="${x + cell/2}" y="${y + cell/2 + 7}" text-anchor="middle" font-size="20" font-weight="900" fill="${barColor || "#9aa8b2"}" style="letter-spacing:.12em">${name.toUpperCase()}</text>`;
  } else if (side === "left" || side === "right") {
    const rx = side === "left" ? x + 30 : x + cell - 18;
    svg += `<text transform="rotate(${side === "left" ? 90 : -90} ${rx} ${y + cell/2})" x="${rx}" y="${y + cell/2}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#aab4c9">${name}</text>`;
  } else {
    const ly = side === "bottom" ? y + cell - 16 : y + 26;
    svg += `<text x="${x + cell/2}" y="${ly}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#aab4c9">${name}</text>`;
  }
}
for (let i = 1; i <= 9; i++) tileRect(i, 10 - i, 10, "bottom");
for (let i = 11; i <= 19; i++) tileRect(i, 0, 10 - (i - 10), "left");
for (let i = 21; i <= 29; i++) tileRect(i, i - 20, 0, "top");
for (let i = 31; i <= 39; i++) tileRect(i, 10, i - 30, "right");
tileRect(0, 10, 10, "corner");
tileRect(10, 0, 10, "corner");
tileRect(20, 0, 0, "corner");
tileRect(30, 10, 0, "corner");
(function tokens() {
  const tileCoords = { 1: [10 - 1, 10], 3: [10 - 3, 10], 8: [10 - 8, 10] };
  const spots = [[1, -14], [1, 14], [3, -14], [3, 14], [8, -14], [8, 14]];
  const colors = ["#e5484d", "#f5a623", "#ffd23e", "#3fe08a", "#38c6ff", "#c9b8ff"];
  const extra = [];
  spots.forEach(([idx, off], si) => {
    const [col, row] = tileCoords[idx];
    const cx = col * cell + cell / 2 + off, cy = row * cell + cell / 2;
    extra.push(`<circle cx="${cx}" cy="${cy}" r="9" fill="${colors[si]}" stroke="rgba(0,0,0,.5)" stroke-width="3" style="filter:drop-shadow(0 0 8px ${colors[si]})"/>`);
  });
  layer.innerHTML = svg + extra.join("");
})();
</script>
</body>
</html>
