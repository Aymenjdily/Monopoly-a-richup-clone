<!doctype html>
<html>
<head><meta charset="utf-8">
<title>Variant C2 rev 2 — Toon field · real depth · flag tiles</title>
<style>
 /* C2 rev 2 — same C3 language (ink + coral + mango + mint + lilac, Segoe UI 900,
    ink outlines, hard shadows) but built as a real 3D slab: layered extrusions,
    boxed houses with roofs, cube dice, camera-facing pawns. */
 * { margin: 0; box-sizing: border-box; }
 :root { --ink: #1f1b2e; --coral: #ff6b81; --mango: #ffc53d; --mint: #7fe3a8; --lilac: #c9b8ff;
         --cream: #fffdf6; --paper: #fffaf0; --muted: #a89fb5; }
 body { width: 1600px; height: 1000px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink);
   background:
     radial-gradient(1100px 800px at 84% 8%, rgba(255,107,129,.18), transparent 62%),
     radial-gradient(1000px 760px at 12% 100%, rgba(201,184,255,.24), transparent 60%),
     radial-gradient(900px 700px at 96% 96%, rgba(127,227,168,.18), transparent 58%),
     radial-gradient(1200px 900px at 30% 20%, rgba(255,197,61,.20), transparent 66%),
     linear-gradient(180deg, #fff7ea 0%, #ffefd8 100%);
   position: relative; }
 .grain { position: absolute; inset: 0; pointer-events: none; opacity: .45; mix-blend-mode: overlay;
   background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.32'/></svg>");
   background-size: 160px 160px; }
 .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 120% at 50% 45%, transparent 62%, rgba(31,27,46,.10) 100%); }
 .conf { position: absolute; opacity: .5; }

 .chip { position: absolute; top: 28px; left: 32px; display: flex; gap: 10px; align-items: center; z-index: 10;
   font-size: 12px; font-weight: 900; letter-spacing: .14em; }
 .chip span { background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 13px; box-shadow: 0 3px 0 var(--ink); }
 .chip span.hl { background: var(--mango); }

 .scene { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 30%; }
 .wrap { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d;
   transform: translate3d(0, 14px, 0) rotateX(42deg) rotateZ(-8deg) scale(.8); }
 .board { position: absolute; transform-style: preserve-3d; background: var(--cream);
   border: 6px solid var(--ink); border-radius: 26px; }
 .board * { transform-style: preserve-3d; }
 .face, .face * { transform-style: flat !important; }
 .abs { position: absolute; }
 .layer { position: absolute; }

 /* tile top faces */
 .face { position: absolute; inset: 0; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 11px; overflow: visible; }
 .band { position: absolute; border: 2.5px solid var(--ink); border-radius: 7px; }
 .flag { position: absolute; width: 28px; height: 19px; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; background: #fff; }
 .flag svg { display: block; width: 100%; height: 100%; }
 .nm { position: absolute; font-weight: 900; line-height: 1.04; font-size: 12.5px; letter-spacing: -.01em; overflow: hidden; }
 .pill { position: absolute; font-size: 10.5px; font-weight: 900; padding: 1px 7px 2px; border: 2px solid var(--ink);
   border-radius: 999px; background: #fff; white-space: nowrap; line-height: 1.2; }
 .icon { position: absolute; font-size: 25px; line-height: 1; }
 .sub { font-size: 9px; font-weight: 900; letter-spacing: .12em; color: #7d7390; }
 .track { background: linear-gradient(#1f1b2e,#1f1b2e) 0 4px/100% 2.5px no-repeat, linear-gradient(#1f1b2e,#1f1b2e) 0 calc(100% - 4px)/100% 2.5px no-repeat, repeating-linear-gradient(90deg, #1f1b2e 0 3px, #c9b8ff 3px 10px) !important; }
 .track.v { background: linear-gradient(#1f1b2e,#1f1b2e) 4px 0/2.5px 100% no-repeat, linear-gradient(#1f1b2e,#1f1b2e) calc(100% - 4px) 0/2.5px 100% no-repeat, repeating-linear-gradient(180deg, #1f1b2e 0 3px, #c9b8ff 3px 10px) !important; }
 .mortgaged::after { content: ""; position: absolute; inset: 0; border-radius: 9px;
   background: repeating-linear-gradient(-45deg, rgba(31,27,46,.13) 0 6px, transparent 6px 12px); }
 .stamp { position: absolute; font-size: 9.5px; font-weight: 900; letter-spacing: .12em; color: var(--coral);
   border: 2px solid var(--coral); border-radius: 5px; padding: 1px 5px; background: #fff; transform: rotate(-12deg); }
 .active { box-shadow: 0 0 0 4px var(--mango), 0 0 0 7px var(--ink), 0 0 26px 10px rgba(255,197,61,.65); }

 /* corners */
 .corner-title { font-size: 21px; font-weight: 900; letter-spacing: -.02em; line-height: 1; }

 /* billboards */
 .plate { font-size: 12px; font-weight: 900; background: #fff; border: 2.5px solid var(--ink); border-radius: 999px;
   padding: 3px 10px; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; display: flex; gap: 6px; align-items: center; }
 .plate i { font-style: normal; font-size: 9.5px; letter-spacing: .1em; background: var(--mango); border: 2px solid var(--ink);
   border-radius: 999px; padding: 0 6px; }
</style></head>
<body>
<div class="grain"></div><div class="vig"></div>
<div class="conf" style="top:110px;left:130px;width:26px;height:26px;border-radius:6px;background:#FF6B81;transform:rotate(24deg)"></div>
<div class="conf" style="top:250px;left:250px;width:16px;height:16px;border-radius:50%;background:#7FE3A8"></div>
<div class="conf" style="top:130px;right:190px;width:30px;height:30px;border-radius:50%;background:#FFC53D"></div>
<div class="conf" style="top:360px;right:110px;width:20px;height:20px;border-radius:6px;background:#C9B8FF;transform:rotate(-18deg)"></div>
<div class="conf" style="bottom:130px;left:150px;width:22px;height:22px;border-radius:50%;background:#C9B8FF"></div>
<div class="conf" style="bottom:100px;right:200px;width:24px;height:24px;border-radius:6px;background:#FF6B81;transform:rotate(40deg)"></div>

<div class="chip"><span class="hl">VARIANT C2 · REV 2</span><span>TOON FIELD · REAL DEPTH · FLAG CITIES</span></div>

<div class="scene"><div class="wrap" id="wrap"></div></div>

<script>
// ───────── geometry ─────────
const B = 960, PAD = 14, C = 128, GAP = 4;
const S = (B - 2 * PAD - 2 * C - 10 * GAP) / 9;       // side tile width ≈ 70.7
const TILE_H = 6;                                     // tile extrusion height
const WALL = 30;                                      // board slab thickness
const INK = "#1f1b2e";

function coords(i) {
  const far = B - PAD - C;
  if (i === 0)  return { x: far, y: far, w: C, h: C, side: "corner" };
  if (i === 10) return { x: PAD, y: far, w: C, h: C, side: "corner" };
  if (i === 20) return { x: PAD, y: PAD, w: C, h: C, side: "corner" };
  if (i === 30) return { x: far, y: PAD, w: C, h: C, side: "corner" };
  if (i < 10) { const j = i;      return { x: far - GAP - j * S - (j - 1) * GAP, y: far, w: S, h: C, side: "bottom" }; }
  if (i < 20) { const j = i - 10; return { x: PAD, y: far - GAP - j * S - (j - 1) * GAP, w: C, h: S, side: "left" }; }
  if (i < 30) { const j = i - 20; return { x: PAD + C + GAP + (j - 1) * (S + GAP), y: PAD, w: S, h: C, side: "top" }; }
  const j = i - 30;               return { x: far, y: PAD + C + GAP + (j - 1) * (S + GAP), w: C, h: S, side: "right" };
}

// ───────── flags (SVG, Windows has no flag emoji) ─────────
const FLAGS = {
  IT: `<rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce2b37"/>`,
  JP: `<rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="5.6" fill="#bc002d"/>`,
  TH: `<rect width="30" height="20" fill="#a51931"/><rect y="3.3" width="30" height="13.4" fill="#f4f5f8"/><rect y="6.7" width="30" height="6.6" fill="#2d2a4a"/>`,
  ES: `<rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/>`,
  TR: `<rect width="30" height="20" fill="#e30a17"/><circle cx="12" cy="10" r="5" fill="#fff"/><circle cx="13.3" cy="10" r="4" fill="#e30a17"/><polygon points="18.2,10 21.6,8.8 19.5,11.8 19.5,8.2 21.6,11.2" fill="#fff"/>`,
  DE: `<rect width="30" height="6.7" fill="#000"/><rect y="6.7" width="30" height="6.6" fill="#dd0000"/><rect y="13.3" width="30" height="6.7" fill="#ffce00"/>`,
  BR: `<rect width="30" height="20" fill="#009c3b"/><polygon points="15,2.5 27,10 15,17.5 3,10" fill="#ffdf00"/><circle cx="15" cy="10" r="4.4" fill="#002776"/>`,
  US: `<rect width="30" height="20" fill="#fff"/>${[0,2,4,6].map(k=>`<rect y="${k*2.86}" width="30" height="2.86" fill="#b22234"/>`).join("")}<rect width="13" height="11.4" fill="#3c3b6e"/>${[[3,3],[6.5,3],[10,3],[4.7,6],[8.3,6],[3,9],[6.5,9],[10,9]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r=".8" fill="#fff"/>`).join("")}`,
};
const flag = (code) => `<svg viewBox="0 0 30 20" preserveAspectRatio="none">${FLAGS[code]}</svg>`;

// ───────── board data (index order matches lib/engine/board.ts) ─────────
const G = { brown:"#c98b5e", lightblue:"#8fd3f5", pink:"#ff9cc6", orange:"#ffab5e", red:"#ff6f6f",
            yellow:"#ffd23e", green:"#5fd99a", darkblue:"#7a9dff" };
const T = [
  { k:"go" },
  { k:"city", g:"brown", c:"IT", n:"Sicily", p:60 },
  { k:"chest" },
  { k:"city", g:"brown", c:"IT", n:"Milan", p:60 },
  { k:"tax", i:"💸", n:"Income Tax", p:200 },
  { k:"rail", i:"🚂", n:"Trans-Sib", p:200 },
  { k:"city", g:"lightblue", c:"JP", n:"Kyoto", p:100 },
  { k:"chance" },
  { k:"city", g:"lightblue", c:"JP", n:"Osaka", p:100 },
  { k:"city", g:"lightblue", c:"JP", n:"Tokyo", p:120 },
  { k:"jail" },
  { k:"city", g:"pink", c:"TH", n:"Phuket", p:140 },
  { k:"util", i:"⚡", n:"Power Grid", p:150 },
  { k:"city", g:"pink", c:"TH", n:"Chiang Mai", p:140 },
  { k:"city", g:"pink", c:"TH", n:"Bangkok", p:160 },
  { k:"rail", i:"🚆", n:"Orient Exp.", p:200 },
  { k:"city", g:"orange", c:"ES", n:"Seville", p:180 },
  { k:"chest" },
  { k:"city", g:"orange", c:"ES", n:"Madrid", p:180 },
  { k:"city", g:"orange", c:"ES", n:"Barcelona", p:200 },
  { k:"parking" },
  { k:"city", g:"red", c:"TR", n:"Antalya", p:220 },
  { k:"chance" },
  { k:"city", g:"red", c:"TR", n:"Izmir", p:220 },
  { k:"city", g:"red", c:"TR", n:"Istanbul", p:240 },
  { k:"rail", i:"🚈", n:"Eurostar", p:200 },
  { k:"city", g:"yellow", c:"DE", n:"Cologne", p:260 },
  { k:"city", g:"yellow", c:"DE", n:"Munich", p:260 },
  { k:"util", i:"💧", n:"Water Works", p:150 },
  { k:"city", g:"yellow", c:"DE", n:"Berlin", p:280 },
  { k:"gotojail" },
  { k:"city", g:"green", c:"BR", n:"Salvador", p:300 },
  { k:"city", g:"green", c:"BR", n:"Rio", p:300 },
  { k:"chest" },
  { k:"city", g:"green", c:"BR", n:"São Paulo", p:320 },
  { k:"rail", i:"🚄", n:"Shinkansen", p:200 },
  { k:"chance" },
  { k:"city", g:"darkblue", c:"US", n:"Miami", p:350 },
  { k:"tax", i:"💎", n:"Luxury Tax", p:100 },
  { k:"city", g:"darkblue", c:"US", n:"New York", p:400 },
];

// demo state (mockup only)
const PLAYERS = {
  sasha: { name:"Sasha", color:"#ff6b81" },
  juno:  { name:"Juno",  color:"#ffc53d" },
  marek: { name:"Marek", color:"#7fe3a8" },
  lina:  { name:"Lina",  color:"#c9b8ff" },
};
const OWN = { 1:"marek", 3:"marek", 6:"juno", 8:"juno", 9:"juno", 12:"sasha", 15:"juno",
              16:"sasha", 18:"sasha", 19:"sasha", 21:"lina", 25:"marek", 37:"lina" };
const HOUSES = { 6:2, 8:2, 9:1, 16:4, 18:4, 19:5 };       // 5 = hotel
const MORTGAGED = { 37:true };
const ACTIVE_TILE = 24;
const PAWNS = [ ["sasha", 24], ["juno", 5], ["marek", 5], ["lina", "jail"] ];

// ───────── dom helpers ─────────
const wrap = document.getElementById("wrap");
function el(parent, style, html = "", cls = "abs") {
  const d = document.createElement("div");
  d.className = cls; d.style.cssText = style; d.innerHTML = html;
  parent.appendChild(d); return d;
}
// rounded extrusion via stacked layers (keeps radius on the sides)
function stack(parent, x, y, w, h, r, z0, z1, color, edge) {
  for (let z = z0; z < z1; z += 1) {
    const isEdge = edge && (z === z0);
    el(parent, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r}px;background:${isEdge ? INK : color};` +
               `transform:translateZ(${z}px);${isEdge ? "" : `border:1.5px solid ${edge ? "rgba(31,27,46,.55)" : "transparent"};`}`, "", "layer");
  }
}
// solid box (houses/dice): faces top/front/back/left/right, optional pitched roof
function box(parent, { x, y, z = 0, w, d, h, rot = 0, top, front, side, roof = 0, roofColor, faces = {} }) {
  const b = el(parent, `left:${x}px;top:${y}px;width:${w}px;height:${d}px;transform:translateZ(${z}px) rotateZ(${rot}deg);transform-origin:50% 50%;`);
  const bd = `border:2px solid ${INK};`;
  el(b, `left:0;top:${d}px;width:${w}px;height:${h}px;background:${front};${bd}transform-origin:50% 0;transform:rotateX(90deg);`, faces.front || "");
  el(b, `left:0;top:${-h}px;width:${w}px;height:${h}px;background:${front};${bd}transform-origin:50% 100%;transform:rotateX(-90deg);`);
  el(b, `left:${-h}px;top:0;width:${h}px;height:${d}px;background:${side};${bd}transform-origin:100% 50%;transform:rotateY(90deg);`);
  el(b, `left:${w}px;top:0;width:${h}px;height:${d}px;background:${side};${bd}transform-origin:0 50%;transform:rotateY(-90deg);`, faces.right || "");
  if (!roof) {
    el(b, `left:0;top:0;width:${w}px;height:${d}px;background:${top};${bd}transform:translateZ(${h}px);${faces.topStyle || ""}`, faces.top || "");
  } else {
    const half = d / 2, L = Math.hypot(half, roof), th = Math.atan2(roof, half) * 180 / Math.PI;
    el(b, `left:-1px;top:${half}px;width:${w + 2}px;height:${L + 1}px;background:${roofColor};${bd}transform-origin:50% 0;transform:translateZ(${h + roof}px) rotateX(${-th}deg);`);
    el(b, `left:-1px;top:${half - L - 1}px;width:${w + 2}px;height:${L + 1}px;background:${roofColor};${bd}transform-origin:50% 100%;transform:translateZ(${h + roof}px) rotateX(${th}deg);`);
    el(b, `left:${-roof}px;top:0;width:${roof}px;height:${d}px;background:${side};clip-path:polygon(0 50%,100% 0,100% 100%);transform-origin:100% 50%;transform:translateZ(${h}px) rotateY(90deg);`);
    el(b, `left:${w}px;top:0;width:${roof}px;height:${d}px;background:${front};clip-path:polygon(0 0,0 100%,100% 50%);transform-origin:0 50%;transform:translateZ(${h}px) rotateY(-90deg);`);
  }
  return b;
}
// camera-facing sprite standing at (ax, ay) on the board
const CAM = "rotateZ(8deg) rotateX(-42deg)";
function billboard(parent, ax, ay, z, w, h, html) {
  return el(parent, `left:${ax - w / 2}px;top:${ay - h}px;width:${w}px;height:${h}px;transform-origin:50% 100%;` +
                    `transform:translateZ(${z}px) ${CAM};`, html);
}

// ───────── board slab ─────────
const board = el(wrap, `left:${-B / 2}px;top:${-B / 2}px;width:${B}px;height:${B}px;`, "", "board");
// floor shadow
el(board, `left:40px;top:70px;width:${B - 20}px;height:${B - 20}px;border-radius:40px;background:rgba(31,27,46,.32);filter:blur(28px);transform:translateZ(${-WALL - 6}px);`);
// slab sides: ink rim with a coral pinstripe
for (let z = -WALL; z < 0; z++) {
  const col = (z >= -19 && z <= -15) ? "#ff6b81" : (z < -26 ? "#141120" : INK);
  el(board, `left:-6px;top:-6px;width:${B}px;height:${B}px;border-radius:26px;background:${col};transform:translateZ(${z}px);`, "", "layer");
}

// center: subtle dotted field + logo painted on the surface
const IN = PAD + C + GAP + 4;
el(board, `left:${IN}px;top:${IN}px;width:${B - 2 * IN}px;height:${B - 2 * IN}px;border-radius:22px;` +
  `background:radial-gradient(circle, rgba(31,27,46,.09) 1.4px, transparent 1.6px) 0 0/22px 22px, #fff7e8;` +
  `border:2.5px dashed rgba(31,27,46,.18);transform:translateZ(.5px);`);
el(board, `left:${IN}px;top:${IN + 80}px;width:${B - 2 * IN}px;text-align:center;transform:translateZ(1px);`,
  `<div style="font-size:92px;font-weight:900;letter-spacing:-.05em;line-height:.9">Dice <span style="color:#ff6b81">&amp;</span><br>Deeds</div>
   <div style="margin-top:16px;font-size:15px;font-weight:900;letter-spacing:.42em;color:#a89fb5">GO AROUND THE WORLD</div>`);

// ───────── tiles ─────────
function tileFace(i, P, t) {
  const side = P.side;
  const owner = OWN[i] && PLAYERS[OWN[i]];
  const pillBg = MORTGAGED[i] ? "#fff" : owner ? owner.color : "#fff";
  const price = MORTGAGED[i] ? `<span style="color:#ff6b81;font-size:8px">MORTGAGED</span>` : t.p ? `$${t.p}` : "";
  const bandCss = (col, extra = "") => side === "bottom" ? `left:6px;right:6px;top:6px;height:24px;background:${col};${extra}`
    : side === "top" ? `left:6px;right:6px;bottom:6px;height:24px;background:${col};${extra}`
    : side === "left" ? `top:6px;bottom:6px;right:6px;width:24px;background:${col};${extra}`
    : `top:6px;bottom:6px;left:6px;width:24px;background:${col};${extra}`;
  let h = "";

  if (t.k === "city" || t.k === "rail") {
    const isRail = t.k === "rail";
    h += `<div class="band${isRail ? " track" + (side === "left" || side === "right" ? " v" : "") : ""}" style="${bandCss(isRail ? "#fff" : G[t.g])}"></div>`;
    const lead = isRail ? `<div class="icon" style="POS;font-size:22px">${t.i}</div>` : `<div class="flag" style="POS">${flag(t.c)}</div>`;
    if (side === "bottom" || side === "top") {
      const top0 = side === "bottom" ? 38 : 8;
      h += lead.replace("POS", `top:${top0}px;left:50%;transform:translateX(-50%)`);
      h += `<div class="nm" style="top:${top0 + 27}px;left:3px;right:3px;height:28px;text-align:center">${t.n}</div>`;
      h += `<div class="pill" style="${side === "bottom" ? "bottom:7px" : "bottom:37px"};left:50%;transform:translateX(-50%);background:${pillBg}">${price}</div>`;
    } else {
      const l = side === "left" ? 8 : 38, r = side === "left" ? 38 : 8;
      h += lead.replace("POS", `top:8px;left:${l}px`);
      h += `<div class="pill" style="top:7px;right:${r}px;background:${pillBg}">${price}</div>`;
      h += `<div class="nm" style="top:33px;left:${l}px;right:${r - 2}px;bottom:4px;text-align:left">${t.n}</div>`;
    }
  } else {
    // special tiles: tinted face + icon, no band
    const spec = {
      chance: { bg:"#fff1c4", icon:`<span style="font-size:34px;font-weight:900;color:#ff6b81;-webkit-text-stroke:2px #1f1b2e;paint-order:stroke">?</span>`, n:"Chance", s:"" },
      chest:  { bg:"#eee8ff", icon:"🎁", n:"Community", s:"CHEST" },
      tax:    { bg:"#ffe3e8", icon:t.i, n:t.n, s:`PAY $${t.p}` },
      util:   { bg:"#e3f8ec", icon:t.i, n:t.n, s:"" },
    }[t.k];
    if (t.k === "util") spec.s = "";
    const pill = t.k === "util" ? `<div class="pill" style="PILL;background:${pillBg}">$${t.p}</div>` : "";
    if (side === "bottom" || side === "top") {
      const y0 = side === "bottom" ? 16 : 12;
      h += `<div class="icon" style="top:${y0}px;left:0;right:0;text-align:center;font-size:28px">${spec.icon}</div>`;
      h += `<div class="nm" style="top:${y0 + 42}px;left:3px;right:3px;height:28px;text-align:center">${spec.n}</div>`;
      if (spec.s) h += `<div class="sub" style="position:absolute;top:${y0 + 72}px;left:0;right:0;text-align:center">${spec.s}</div>`;
      h += pill.replace("PILL", `bottom:8px;left:50%;transform:translateX(-50%)`);
    } else {
      h += `<div class="icon" style="top:50%;${side === "left" ? "left:10px" : "left:12px"};transform:translateY(-50%);font-size:26px;width:34px;text-align:center">${spec.icon}</div>`;
      h += `<div class="nm" style="top:${spec.s || pill ? 12 : 0}px;${spec.s || pill ? "" : "bottom:0;display:flex;align-items:center;"}left:52px;right:6px;height:${spec.s || pill ? 28 : "auto"}px">${spec.n}</div>`;
      if (spec.s) h += `<div class="sub" style="position:absolute;top:43px;left:52px">${spec.s}</div>`;
      h += pill.replace("PILL", `top:40px;left:52px`);
    }
    return { html: h, bg: spec.bg };
  }
  return { html: h, bg: "var(--paper)" };
}

function cornerFace(t) {
  if (t.k === "go") return { bg: "#dcf6e8", html: `
    <svg style="position:absolute;left:10px;top:12px" width="104" height="44" viewBox="0 0 104 44">
      <path d="M100 22 H30 M42 6 L22 22 L42 38" fill="none" stroke="#1f1b2e" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M100 22 H30 M42 6 L22 22 L42 38" fill="none" stroke="#ff6b81" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="corner-title" style="position:absolute;left:0;right:0;top:62px;text-align:center;font-size:36px">GO</div>
    <div class="sub" style="position:absolute;left:0;right:0;bottom:12px;text-align:center">COLLECT $200</div>` };
  if (t.k === "jail") return { bg: "#ffe9cf", html: `
    <div style="position:absolute;right:8px;top:8px;width:78px;height:78px;border:2.5px solid #1f1b2e;border-radius:9px;overflow:hidden;
      background:repeating-linear-gradient(90deg,#1f1b2e 0 4px,#ffab5e 4px 15px)">
      <div style="position:absolute;left:0;right:0;bottom:0;height:20px;background:#1f1b2e;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.12em;display:grid;place-items:center">IN JAIL</div></div>
    <div class="sub" style="position:absolute;left:0;right:0;bottom:12px;text-align:center">JUST VISITING</div>
    <div style="position:absolute;left:10px;top:26px;font-size:26px">🔒</div>` };
  if (t.k === "parking") return { bg: "#ece6ff", html: `
    <div style="position:absolute;left:0;right:0;top:16px;text-align:center;font-size:46px;line-height:1">🚗</div>
    <div class="corner-title" style="position:absolute;left:0;right:0;top:74px;text-align:center;font-size:17px">FREE<br>PARKING</div>` };
  return { bg: "#ffdbe1", html: `
    <div style="position:absolute;left:0;right:0;top:14px;text-align:center;font-size:46px;line-height:1">👮</div>
    <div class="corner-title" style="position:absolute;left:0;right:0;top:72px;text-align:center;font-size:17px">GO TO<br>JAIL</div>` };
}

const tileEls = [];
for (let i = 0; i < 40; i++) {
  const P = coords(i), t = T[i];
  const r = P.side === "corner" ? 16 : 11;
  stack(board, P.x, P.y, P.w, P.h, r, 0, TILE_H - 1, "#e4d8c0", true);
  const f = P.side === "corner" ? cornerFace(t) : tileFace(i, P, t);
  const face = el(board, `left:${P.x}px;top:${P.y}px;width:${P.w}px;height:${P.h}px;transform:translateZ(${TILE_H + 1}px);`);
  const inner = el(face, `background:${f.bg};border-radius:${r}px`, f.html, "face" + (MORTGAGED[i] ? " mortgaged" : "") + (i === ACTIVE_TILE ? " active" : ""));
  tileEls.push(inner);
}

// fit names that overflow
document.querySelectorAll(".nm").forEach((n) => {
  let fs = 12.5;
  while ((n.scrollWidth > n.clientWidth + 1 || n.scrollHeight > n.clientHeight + 1) && fs > 9) { fs -= .5; n.style.fontSize = fs + "px"; }
});

// ───────── houses & hotels (on the color band) ─────────
for (const [idxS, n] of Object.entries(HOUSES)) {
  const i = +idxS, P = coords(i);
  const z = TILE_H;
  // band center line
  const bandC = P.side === "bottom" ? { x: P.x + P.w / 2, y: P.y + 18 } : P.side === "top" ? { x: P.x + P.w / 2, y: P.y + P.h - 18 }
    : P.side === "left" ? { x: P.x + P.w - 18, y: P.y + P.h / 2 } : { x: P.x + 18, y: P.y + P.h / 2 };
  const horizontal = P.side === "bottom" || P.side === "top";
  if (n === 5) {
    const w = horizontal ? 36 : 18, d = horizontal ? 18 : 36;
    box(board, { x: bandC.x - w / 2, y: bandC.y - d / 2, z, w, d, h: 18, top: "#ff6b81", front: "#e5485f", side: "#c7364c", roof: 0 });
    continue;
  }
  const hw = 13, hd = 13, gap = 1.5, span = n * hw + (n - 1) * gap;
  for (let k = 0; k < n; k++) {
    const off = -span / 2 + k * (hw + gap);
    const x = horizontal ? bandC.x + off : bandC.x - hd / 2;
    const y = horizontal ? bandC.y - hd / 2 : bandC.y + off;
    box(board, { x, y, z, w: horizontal ? hw : hd, d: horizontal ? hd : hw, h: 10, rot: 0,
      front: "#3fbf7f", side: "#2f9e67", roof: 8, roofColor: "#7fe3a8" });
  }
}

// ───────── center props: decks + dice ─────────
function deck(x, y, rot, bg, label, icon) {
  const w = 138, d = 90;
  const g = el(board, `left:${x}px;top:${y}px;width:${w}px;height:${d}px;transform:rotateZ(${rot}deg);`);
  for (let z = 0; z < 12; z++) el(g, `left:0;top:0;width:${w}px;height:${d}px;border-radius:12px;background:${z === 0 ? INK : (z % 3 === 0 ? "#e7dcc6" : "#fffaf0")};border:1.5px solid rgba(31,27,46,.6);transform:translateZ(${z}px)`, "", "layer");
  el(g, `left:0;top:0;width:${w}px;height:${d}px;border-radius:12px;background:${bg};border:3px solid ${INK};transform:translateZ(12px);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;`,
    `<div style="font-size:30px;line-height:1">${icon}</div><div style="font-size:13px;font-weight:900;letter-spacing:.14em">${label}</div>`);
}
deck(IN + 40, IN + 360, -14, "#ffd23e", "CHANCE",
  `<span style="font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:2.5px #1f1b2e;paint-order:stroke">?</span>`);
deck(B - IN - 40 - 138, IN + 360, 14, "#c9b8ff", "COMMUNITY", "🎁");

function pipsFor(n) {
  const P = { 1:[[2,2]], 2:[[1,1],[3,3]], 3:[[1,1],[2,2],[3,3]], 4:[[1,1],[1,3],[3,1],[3,3]],
              5:[[1,1],[1,3],[2,2],[3,1],[3,3]], 6:[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]] }[n];
  return (col) => `<div style="position:absolute;inset:5px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr)">` +
    P.map(([r, c]) => `<i style="grid-area:${r}/${c};width:7px;height:7px;border-radius:50%;background:${col};place-self:center"></i>`).join("") + `</div>`;
}
function die(x, y, rot, face, frontN, rightN, top, front, side, pip) {
  box(board, { x, y, z: 0, w: 40, d: 40, h: 40, rot, top, front, side,
    faces: { top: pipsFor(face)(pip), front: pipsFor(frontN)(pip), right: pipsFor(rightN)(pip), topStyle: "border-radius:6px;" } });
}
die(B / 2 - 58, IN + 392, 18, 4, 2, 6, "#ff6b81", "#e5485f", "#c7364c", "#fff");
die(B / 2 + 14, IN + 380, -10, 3, 5, 1, "#ffffff", "#ece4d4", "#d8ccb6", INK);

// ───────── pawns (camera-facing) ─────────
function pawnSVG(color) {
  return `<svg width="34" height="50" viewBox="0 0 34 50" style="display:block;overflow:visible">
    <ellipse cx="17" cy="44" rx="14" ry="5" fill="${color}" stroke="${INK}" stroke-width="3"/>
    <path d="M9 43 C10 34 13 29 13 25 L21 25 C21 29 24 34 25 43 Z" fill="${color}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
    <rect x="9.5" y="22" width="15" height="5.5" rx="2.7" fill="${color}" stroke="${INK}" stroke-width="3"/>
    <circle cx="17" cy="14" r="8.5" fill="${color}" stroke="${INK}" stroke-width="3"/>
    <circle cx="14" cy="11" r="2.6" fill="#fff" opacity=".85"/>
  </svg>`;
}
const byTile = {};
PAWNS.forEach(([id, where]) => { (byTile[where] = byTile[where] || []).push(id); });
const OFFS = { 1: [[0, 0]], 2: [[-13, 0], [13, 0]], 3: [[-14, -8], [14, -8], [0, 10]], 4: [[-13, -9], [13, -9], [-13, 9], [13, 9]] };
for (const [where, ids] of Object.entries(byTile)) {
  let cx, cy;
  if (where === "jail") { const P = coords(10); cx = P.x + P.w - 8 - 39; cy = P.y + 8 + 50; }
  else {
    const P = coords(+where);
    cx = P.x + P.w / 2; cy = P.y + P.h / 2;
    if (P.side === "bottom") cy += 20; if (P.side === "top") cy = P.y + 30;
    if (P.side === "left") cx -= 10; if (P.side === "right") cx += 12;
  }
  ids.forEach((id, k) => {
    const [ox, oy] = OFFS[ids.length][k];
    const ax = cx + ox, ay = cy + oy, pl = PLAYERS[id];
    el(board, `left:${ax - 15}px;top:${ay - 7}px;width:30px;height:14px;border-radius:50%;background:rgba(31,27,46,.28);transform:translateZ(${TILE_H + .6}px);filter:blur(1.5px)`);
    billboard(board, ax, ay, TILE_H + 1, 34, 50, pawnSVG(pl.color));
    if (where == ACTIVE_TILE) {
      billboard(board, ax, ay - 2, TILE_H + 1, 150, 74,
        `<div style="position:absolute;left:0;right:0;top:0;display:flex;justify-content:center"><div class="plate">Sasha <i>YOUR TURN</i></div></div>`);
    }
  });
}
</script>
