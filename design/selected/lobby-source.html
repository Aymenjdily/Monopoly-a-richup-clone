<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  /* C3 — lobby. Cream + mesh shader bg, one ink, coral/mango/mint accents. */
  * { margin: 0; box-sizing: border-box; }
  body { width: 1600px; height: 1000px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif;
         color: #1f1b2e;
         background:
           radial-gradient(1100px 800px at 84% 8%, rgba(255,107,129,.20), transparent 62%),
           radial-gradient(1000px 760px at 12% 100%, rgba(201,184,255,.26), transparent 60%),
           radial-gradient(900px 700px at 96% 96%, rgba(127,227,168,.18), transparent 58%),
           radial-gradient(1200px 900px at 30% 20%, rgba(255,197,61,.20), transparent 66%),
           linear-gradient(180deg, #fff7ea 0%, #ffefd8 100%);
         position: relative; }
  .glow { position: absolute; inset: 0; pointer-events: none; z-index: 0;
          background: radial-gradient(760px 560px at 50% 47%, rgba(255,255,255,.9), transparent 70%); }
  .grain { position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .5; mix-blend-mode: overlay;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.32'/></svg>");
           background-size: 160px 160px; }
  .vig { position: absolute; inset: 0; pointer-events: none; z-index: 0;
         background: radial-gradient(120% 120% at 50% 45%, transparent 62%, rgba(31,27,46,.10) 100%); }

  .conf { position: absolute; z-index: 1; opacity: .5; }
  .c1 { top: 100px; left: 140px; width: 26px; height: 26px; border-radius: 6px; background: #FF6B81; transform: rotate(24deg); }
  .c2 { top: 260px; left: 90px;  width: 18px; height: 18px; border-radius: 50%; background: #7FE3A8; }
  .c3 { top: 140px; right: 170px; width: 28px; height: 28px; border-radius: 50%; background: #FFC53D; }
  .c4 { bottom: 150px; left: 240px; width: 22px; height: 22px; border-radius: 50%; background: #C9B8FF; }
  .c5 { bottom: 110px; right: 200px; width: 26px; height: 26px; border-radius: 6px; background: #7FE3A8; transform: rotate(30deg); }

  .card { z-index: 2; width: 860px; background: #fff; border: 3.5px solid #1f1b2e; border-radius: 28px;
          box-shadow: 0 9px 0 #1f1b2e, 30px 34px 0 rgba(31,27,46,.10);
          position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
          padding: 38px 44px 34px; }
  .head { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
  .back { width: 46px; height: 46px; border: 3px solid #1f1b2e; border-radius: 13px; background: #fff7ea;
          font-size: 19px; font-weight: 900; display: flex; align-items: center; justify-content: center;
          box-shadow: 0 4px 0 #1f1b2e; }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: -.02em; }
  .count { margin-left: auto; background: #FFC53D; border: 3px solid #1f1b2e; border-radius: 999px;
           padding: 9px 18px; font-weight: 900; font-size: 15px; box-shadow: 0 3px 0 #1f1b2e; }

  .codeline { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .tile { width: 56px; height: 62px; background: #1f1b2e; color: #fff; border-radius: 14px;
          font-family: Consolas, monospace; font-size: 32px; font-weight: 900;
          display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 rgba(31,27,46,.25); }
  .tile:nth-child(2n) { background: #FF6B81; }
  .copy { width: 54px; height: 54px; border: 3px solid #1f1b2e; border-radius: 13px; background: #fff7ea;
          display: flex; align-items: center; justify-content: center; font-size: 22px;
          box-shadow: 0 4px 0 #1f1b2e; margin-left: 10px; }
  .hint { color: #a89fb5; font-weight: 700; font-size: 13px; margin-bottom: 26px; }

  .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 26px; }
  .seat { display: flex; align-items: center; gap: 14px; border: 3px solid #1f1b2e; border-radius: 16px;
          padding: 14px 18px; font-weight: 800; font-size: 19px; background: #fff;
          box-shadow: 0 4px 0 #1f1b2e; }
  .seat.you { background: #eefcf4; }
  .pawn { width: 34px; height: 34px; flex: none; position: relative; }
  .pawn i { position: absolute; background: inherit; border: 3px solid #1f1b2e; }
  .pawn .h { width: 15px; height: 15px; border-radius: 50%; top: 0; left: 50%; transform: translateX(-50%); }
  .pawn .b { width: 23px; height: 13px; border-radius: 11px 11px 4px 4px; bottom: 0; left: 50%; transform: translateX(-50%); }
  .tag { margin-left: auto; font-size: 11px; font-weight: 900; letter-spacing: .08em; border: 2.5px solid #1f1b2e;
         border-radius: 999px; padding: 4px 12px; background: #FFC53D; }
  .invite { border-style: dashed; box-shadow: none; color: #b6adc4; background: #fff7ea;
            display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 800; }

  button.big { width: 100%; background: #1f1b2e; color: #fff; border: 3.5px solid #1f1b2e; border-radius: 18px;
               padding: 19px; font-size: 23px; font-weight: 900; cursor: pointer;
               box-shadow: 0 6px 0 rgba(31,27,46,.28); display: flex; align-items: center; justify-content: center; gap: 14px; }
  .big i { font-style: normal; background: #7FE3A8; color: #1f1b2e; border-radius: 999px; padding: 4px 12px; font-size: 15px; font-weight: 900; }
  .foot { margin-top: 18px; text-align: center; color: #a89fb5; font-weight: 700; font-size: 13px; }
</style></head>
<body>
  <div class="glow"></div><div class="vig"></div><div class="grain"></div>
  <div class="conf c1"></div><div class="conf c2"></div><div class="conf c3"></div>
  <div class="conf c4"></div><div class="conf c5"></div>
  <div class="card">
    <div class="head">
      <div class="back">←</div>
      <h1>Waiting room</h1>
      <div class="count">2 / 6 PLAYERS</div>
    </div>
    <div class="codeline">
      <div class="tile">X</div><div class="tile">4</div><div class="tile">K</div>
      <div class="tile">9</div><div class="tile">R</div><div class="tile">D</div>
      <div class="copy">⧉</div>
    </div>
    <div class="hint">Friends open the site and enter this code — no account needed.</div>
    <div class="seats">
      <div class="seat you"><div class="pawn" style="background:#FF6B81"><i class="h"></i><i class="b"></i></div>Sasha <span style="color:#b6adc4">(you)</span><span class="tag">HOST ★</span></div>
      <div class="seat"><div class="pawn" style="background:#FFC53D"><i class="h"></i><i class="b"></i></div>Juno</div>
      <div class="seat invite">＋ Invite a friend</div>
      <div class="seat invite">＋ Invite a friend</div>
    </div>
    <button class="big">START THE GAME <i>3+ NEEDED</i></button>
    <div class="foot">The lobby updates live — everyone sees new players instantly.</div>
  </div>
</body>
</html>
